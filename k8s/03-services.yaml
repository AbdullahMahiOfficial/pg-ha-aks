apiVersion: v1
kind: Service
metadata:
  name: pg-ha-primary
  namespace: postgres-ha
  labels:
    cluster-name: pg-ha-cluster
    role: master
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
    - name: patroni-metrics
      port: 8008
      targetPort: 8008
  selector:
    cluster-name: pg-ha-cluster
    role: master
---
apiVersion: v1
kind: Service
metadata:
  name: pg-ha-replicas
  namespace: postgres-ha
  labels:
    cluster-name: pg-ha-cluster
    role: replica
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    cluster-name: pg-ha-cluster
    role: replica
---
apiVersion: v1
kind: Service
metadata:
  name: pg-ha-headless
  namespace: postgres-ha
  labels:
    cluster-name: pg-ha-cluster
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8008"
    prometheus.io/path: "/metrics"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
    - name: patroni-metrics
      port: 8008
      targetPort: 8008
  selector:
    cluster-name: pg-ha-cluster