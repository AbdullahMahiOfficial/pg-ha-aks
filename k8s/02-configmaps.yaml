apiVersion: v1
kind: ConfigMap
metadata:
  name: patroni-config
  namespace: postgres-ha
data:
  patroni.yml: |
    scope: pg-ha-cluster
    namespace: postgres-ha
    name: ${POD_NAME}

    kubernetes:
      namespace: postgres-ha
      labels:
        cluster-name: pg-ha-cluster
      use_endpoints: true
      pod_ip: ${POD_IP}
      ports:
        - name: postgresql
          port: 5432

    bootstrap:
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
        maximum_lag_on_failover: 1048576
        master_start_timeout: 300
        synchronous_mode: false
        use_slots: true
        postgresql:
          use_pg_rewind: true
          use_slots: true
          parameters:
            wal_level: replica
            hot_standby: "on"
            max_wal_senders: 10
            max_replication_slots: 10
            wal_log_hints: "on"
            max_slot_wal_keep_size: 10GB
            wal_keep_size: 2GB
            archive_mode: "on"
            archive_command: "pgbackrest --stanza=pg-ha archive-push %p"
            archive_timeout: 300s
            shared_preload_libraries: "pg_stat_statements"
            log_min_duration_statement: 1000
      initdb:
        - encoding: UTF8
        - data-checksums
      pg_hba:
        - host replication replicator 0.0.0.0/0 scram-sha-256
        - host all all 0.0.0.0/0 scram-sha-256
      users:
        admin:
          password: ${SUPERUSER_PASSWORD}
          options:
            - createrole
            - createdb

    postgresql:
      listen: 0.0.0.0:5432
      connect_address: ${POD_IP}:5432
      data_dir: /var/lib/postgresql/data/pgdata
      bin_dir: /usr/lib/postgresql/16/bin
      authentication:
        replication:
          username: replicator
          password: ${REPLICATION_PASSWORD}
        superuser:
          username: postgres
          password: ${SUPERUSER_PASSWORD}
      parameters:
        unix_socket_directories: '/var/run/postgresql'
      create_replica_methods:
        - pgbackrest
        - basebackup
      pgbackrest:
        command: pgbackrest --stanza=pg-ha --delta restore
        keep_data: True
        no_params: True

    restapi:
      listen: 0.0.0.0:8008
      connect_address: ${POD_IP}:8008

    watchdog:
      mode: off

    tags:
      nofailover: false
      noloadbalance: false
      clonefrom: false
      nosync: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbackrest-config
  namespace: postgres-ha
data:
  pgbackrest.conf: |
    [global]
    repo1-type=azure
    repo1-path=/pg-ha-backups
    repo1-cipher-type=none
    repo1-retention-full=2
    repo1-retention-full-type=count
    repo1-retention-archive-type=full
    repo1-retention-archive=2
    process-max=4
    log-level-console=info
    log-level-file=detail
    start-fast=y
    delta=y

    [pg-ha]
    pg1-path=/var/lib/postgresql/data/pgdata
    pg1-port=5432
    pg1-user=postgres